<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dayview Journal — Backtrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module" crossorigin src="/assets/dayJournal-DiqiJVK0.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/firebaseConfig-CkS4MF7D.js">
  <link rel="modulepreload" crossorigin href="/assets/journalEntries-BQ5A6jxR.js">
  <link rel="stylesheet" crossorigin href="/assets/dayJournal-vrQNIrxB.css">
</head>
<body class="container-fluid min-vh-100 d-flex justify-content-center p-0">
  <a class="btn btn-light border shadow-sm side-nav-button side-nav-login position-fixed" href="login.html" aria-label="Go to login">
    <span class="side-nav-arrow" aria-hidden="true">‹</span>
    <span class="side-nav-tooltip" aria-hidden="true">Login</span>
  </a>
  <main class="journal-shell d-flex flex-column flex-grow-1 mx-auto" aria-label="Dayview journal page">
    <header class="clock-box" aria-live="polite">
      <span class="section-label"><b>It is...</b></span>
      <time class="clock-time" id="liveClock">--:--:--</time>
      <span class="clock-date" id="liveDate"></span>
    </header>
    <section class="journal-box" aria-label="Today's journal">
      <div class="journal-header">
        <label class="section-label" for="journalTextarea">Today's journal</label>
        <div class="journal-actions">
          <span class="journal-image-help" id="journalImageHelp">1 picture per day, max 2 MB, compressed for Firestore</span>
          <button class="journal-save-button" id="journalSaveButton" type="button" disabled>Save entry</button>
          <input
            class="visually-hidden journal-image-input"
            id="journalImageInput"
            type="file"
            accept="image/*"
            aria-describedby="journalImageHelp"
            disabled
          >
          <label class="journal-image-button" for="journalImageInput">Add or replace picture</label>
          <span class="save-status" id="journalStatus" role="status" aria-live="polite">Loading today's entry...</span>
        </div>
      </div>
      <img class="journal-image-preview" id="journalImagePreview" alt="Today's journal picture" hidden>
      <textarea
        id="journalTextarea"
        class="journal-textarea"
        placeholder="Write your reflections, notes, or progress for today…"
        aria-label="Today's journal entry"
      ></textarea>
    </section>
    <section class="todo-box" aria-label="ToDo">
      <span class="section-label">ToDo</span>
      <form class="todo-form" id="todoForm">
        <input
          class="todo-input"
          id="todoInput"
          type="text"
          placeholder="Add a to-do item…"
          aria-label="To-do item"
          maxlength="120"
          required
        >
        <button class="todo-save-btn" id="todoSaveBtn" type="submit" aria-label="Save to-do item">save</button>
      </form>
      <div class="todo-list" id="todoList" aria-live="polite"></div>
    </section>
  </main>
  <a class="btn btn-light border shadow-sm side-nav-button side-nav-calendar position-fixed" href="calendar.html" aria-label="Go to calendar">
    <span class="side-nav-arrow" aria-hidden="true">›</span>
    <span class="side-nav-tooltip" aria-hidden="true">Calendar</span>
  </a>

</body>
</html>
