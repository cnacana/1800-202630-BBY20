<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Day View</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons for Navigation Arrows -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 m-0">

    <div class="card shadow-sm w-100 mx-3" style="max-width: 450px; height: 80vh;">
        
       
        <header class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom-0">
            <button class="btn btn-link link-secondary p-0" id="prev-day">
                <i class="bi bi-chevron-left fs-5"></i>
            </button>
    <div class="position-relative">
        <input type="text" 
               class="form-control border-0 fw-bold text-center text-uppercase text-muted shadow-none bg-transparent" 
               id="date-display" 
               placeholder="DATE HERE" 
               style="letter-spacing: 0.05em; width: 150px; cursor: pointer;"
               onfocus="(this.type='date')" 
               onblur="if(!this.value){this.type='text'}">
    </div>
            
           
            <button class="btn btn-link link-secondary p-0" id="next-day">
                <i class="bi bi-chevron-right fs-5"></i>
            </button>
        </header>

        
        <main class="card-body p-3 pt-0 d-flex flex-column">
            <div class="flex-grow-1 border rounded bg-white p-3">
                
                <textarea class="form-control border-0 h-100 w-100 p-0 shadow-none text-secondary" 
                          id="journal-entry" 
                          placeholder="Start typing your data entry..." 
                          style="resize: none; font-size: 0.95rem; line-height: 1.6;"></textarea>
            </div>
        </main>

    </div>

</body>
</html>
