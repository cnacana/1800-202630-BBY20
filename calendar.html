<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/calendar.css">
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center min-vh-100 m-0">
    <button class="btn btn-link link-secondary p-0 text-center" onclick="window.location.href='index.html'">
        <i class="bi bi-chevron-left fs-5"></i>
    </button>
    <h1 id="year-name">Year</h1>
    <div class="d-flex align-items-center justify-content-center w-50">
        <button class="btn btn-link link-secondary p-0 text-center" onclick="changeMonth(-1)">
            <i class="bi bi-chevron-left fs-5"></i>
        </button>
        <div class="text-center">
            <h2 id="month-name" class="mb-0">Month</h2>
        </div>
        <button class="btn btn-link link-secondary p-0 text-center" onclick="changeMonth(1)">
            <i class="bi bi-chevron-right fs-5"></i>
        </button>
    </div>
    <div class="card shadow-sm w-100 mx-3">
        <div id="calendar-grid"></div>
    </div>
    <div class="card shadow-sm w-100 mx-3">
        <header class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom-0"></header>
        <main class="card-body p-3 pt-0 d-flex flex-column">
            <div class="flex-grow-1 border rounded bg-white p-3">
                <label for="journal-entry">Notes</label>
                <textarea class="form-control border-0 h-100 w-100 p-0 shadow-none text-secondary" id="journal-entry" placeholder="Type here..." style="resize: none; font-size: 0.95rem; line-height: 1.6;"></textarea>
            </div>
        </main>
    </div>
    <script src="src/render_calendar.js"></script>
</body>
<script type="module" src="/src/components/site-footer.js"></script>
</html>
