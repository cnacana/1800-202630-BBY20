<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/calendar.css">
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center min-vh-100 m-0">
    <main class="app-shell">
        <!--
        <button class="btn btn-link link-secondary p-0 text-center" onclick="window.location.href='index.html'">
            <i class="bi bi-chevron-left fs-5"></i>
        </button>
        -->
        <header class="year-bar">
            <a class="btn btn-outline-secondary btn-sm" href="dayview journal.html">
              Dayview Journal
               </a>
            <button class="nav-arrow prev" onclick="changeYear(-1)">
                <i class="bi bi-chevron-left fs-5"></i>
            </button>
            <h1 id="year-name" class="year-label">Year</h1>
            <button class="nav-arrow " onclick="changeYear(1)">
                <i class="bi bi-chevron-right fs-5"></i>
            </button>
        </header>
        <section class="calendar-stage">
            <div class="month-row">
                <button class="side-arrow prev" onclick="changeMonth(-1)">
                    <i class="bi bi-chevron-left fs-5"></i>
                </button>
                <div class="month-card">
                    <div class="month-title">
                        <h2><span id="month-name">Month</span></h2>
                    </div>
                    <div class="weekday-grid" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
                    <div id="calendar-grid" class="dates-grid"></div>
                </div>
                <button class="side-arrow" onclick="changeMonth(1)">
                    <i class="bi bi-chevron-right fs-5"></i>
                </button>
            </div>
            <section class="event-area">
                <div class="event-form">
                    <textarea class="event-input" id="journal-entry" placeholder="Type here..." style=""></textarea>
                    <p id="journal-save-status" class="mt-2 mb-0" role="status" aria-live="polite"></p>
                    <button class="save-button" id="save-journal-entry" type="button">Save</button>
                </div>
                <div class="event-list" id="eventList" aria-live="polite"></div>
            </section>
        </section>
    </main>
<script type="module" src="src/render_calendar.js"></script>
<script type="module" src="/src/calanderdata.js"></script>
</body>
<script type="module" src="/src/components/site-footer.js"></script>
</html>
