<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/calendar.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 m-0">

    <div class="card shadow-sm w-100 mx-3 calendar-card">
        
        <header class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom-0">
            <button class="btn btn-link link-secondary p-0" id="previous-month" onclick="changeMonth(-1)">
                <i class="bi bi-chevron-left fs-5"></i>
            </button>
            <div class="text-center text-uppercase text-muted header-date-title d-flex gap-1 fw-bold">
                <span id="month-name">Month</span>
                <span id="year-name">Year</span>
            </div>
            <button class="btn btn-link link-secondary p-0" id="next-month" onclick="changeMonth(1)">
                <i class="bi bi-chevron-right fs-5"></i>
            </button>
        </header>
        <main class="card-body p-3 pt-0 d-flex flex-column overflow-hidden">
            <div class="flex-grow-1 border rounded bg-white p-2 d-flex flex-column h-100 overflow-hidden">
                <div class="weekday-header-grid text-center fw-bold text-uppercase text-muted border-bottom py-1">
                    <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                </div>
                <div id="calendar-grid"></div>

            </div>
        </main>

    </div>
    <script src="src/render_calendar.js"></script>
</body>
</html>
