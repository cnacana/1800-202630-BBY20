<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/calendar.css">
</head>
<body class="bg-secondary d-flex flex-column align-items-center justify-content-center min-vh-100 m-0">
    <main class="app-shell">
        <a class="nav-arrow back-today" href="day_journal.html" aria-label="Back to today">
            <i class="bi bi-chevron-left fs-5" aria-hidden="true"></i>
            <span class="back-today-tooltip" aria-hidden="true">Back to today</span>
        </a>
        <header class="year-bar">
            <button class="nav-arrow prev" onclick="changeYear(-1)" aria-label="Previous year">
                <i class="bi bi-chevron-left fs-5" aria-hidden="true"></i>
                <span class="back-today-tooltip" aria-hidden="true">Previous year</span>
            </button>
            <h1 id="year-name" class="year-label">Year</h1>
            <button class="nav-arrow" onclick="changeYear(1)" aria-label="Next year">
                <i class="bi bi-chevron-right fs-5" aria-hidden="true"></i>
                <span class="back-today-tooltip" aria-hidden="true">Next year</span>
            </button>
        </header>
        <section class="calendar-stage">
            <div class="month-row">
                <button class="side-arrow prev" onclick="changeMonth(-1)">
                    <i class="bi bi-chevron-left fs-5"></i>
                </button>
                <div class="month-card">
                    <div class="month-title">
                        <h2><span id="month-name">Month</span></h2>
                    </div>
                    <div class="weekday-grid" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
                    <div id="calendar-grid" class="dates-grid"></div>
                </div>
                <button class="side-arrow" onclick="changeMonth(1)">
                    <i class="bi bi-chevron-right fs-5"></i>
                </button>
            </div>
            <section class="event-area">
                <div class="event-form">
                    <textarea class="event-input" id="journal-entry" placeholder="Type here..." aria-label="Journal entry for selected day"></textarea>
                    <div class="event-actions">
                        <div class="event-image-actions">
                            <input class="visually-hidden event-image-input" id="journal-image-upload" type="file" accept="image/*" aria-describedby="journal-image-help" disabled>
                            <label class="event-image-button" for="journal-image-upload">Add or replace picture</label>
                            <span class="event-image-help" id="journal-image-help">1 picture per day, max 2 MB</span>
                            <button class="event-image-thumbnail" id="journal-image-thumbnail" type="button" aria-label="Open picture for selected day" hidden>
                                <img id="journal-image-preview" alt="">
                            </button>
                        </div>
                        <button class="save-button" id="save-journal-entry" type="button">Save</button>
                    </div>
                    <p id="journal-save-status" class="mt-2 mb-0" role="status" aria-live="polite"></p>
                </div>
                <div class="event-list" id="eventList" aria-live="polite"></div>
            </section>
        </section>
    </main>
    <div class="image-lightbox" id="journal-image-lightbox" role="dialog" aria-modal="true" aria-label="Journal picture" hidden>
        <button class="image-lightbox-close" id="journal-image-lightbox-close" type="button" aria-label="Close picture">×</button>
        <img class="image-lightbox-image" id="journal-image-lightbox-image" alt="Picture for selected journal day">
    </div>
<script type="module" src="src/render_calendar.js"></script>
</body>
<script type="module" src="/src/components/site-footer.js"></script>
</html>
