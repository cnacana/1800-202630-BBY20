<!DOCTYPE html>
<html lang="en">

<head>
    <title>login</title>
    <meta name="loginpage" content="portingfirebase">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/index.css">

    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>

    <site-navbar></site-navbar>

    <div class="container-fluid bg-dark d-flex align-items-center justify-content-center flex-grow-1 text-light px-4" style="min-height: 80vh;">
        <div class="w-100 py-5" style="max-width: 420px;">
            <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

            <!-- Login -->
            <div id="loginView">
                <h3 class="mb-3 text-center fw-bold">Login</h3>
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <input type="email" id="loginEmail" class="form-control" placeholder="Email" required />
                    </div>
                    <div class="mb-3">
                        <input type="password" id="loginPassword" class="form-control" placeholder="Password" required />
                    </div>
                    <button type="submit" class="btn btn-orange w-100">Login</button>
                </form>
                <small class="d-block mt-3 text-center text-light">
                    Don’t have an account?
                    <a href="#" id="toSignup" class="text-warning">Sign up</a>
                </small>
            </div>

            <!-- Signup -->
            <div id="signupView" class="d-none">
                <h3 class="mb-3 text-center fw-bold">Sign Up</h3>
                <form id="signupForm" novalidate>
                    <div class="mb-3">
                        <input type="text" id="signupName" class="form-control" placeholder="First and Last Name"
                            aria-label="Full name" required />
                    </div>
                    <div class="mb-3">
                        <input type="email" id="signupEmail" class="form-control" placeholder="Email" required />
                    </div>
                    <div class="mb-3">
                        <input type="password" id="signupPassword" class="form-control" placeholder="Password" required />
                    </div>
                    <button type="submit" class="btn btn-orange w-100">Create Account</button>
                </form>
                <small class="d-block mt-3 text-center text-light">
                    Already have an account?
                    <a href="#" id="toLogin" class="text-warning">Login</a>
                </small>
            </div>
        </div>
    </div>

    <!-- our own footer goes here -->
    <site-footer></site-footer>


    <!-- Firebase and authentication related scripts -->
    <!-- The order of loading matters -->
    <script type="module" src="/src/loginSignup.js"></script>

</body>

</html>
