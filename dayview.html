<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dayview Calendar</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="styles/dayview.css">	
</head>
<body>
	<main class="app-shell">
		<header class="year-bar" aria-label="Year navigation">
			<button class="nav-arrow prev" id="prevYear" aria-label="Previous year"><span class="chevron"></span></button>
			<div class="year-label" id="yearLabel" aria-live="polite"></div>
			<button class="nav-arrow" id="nextYear" aria-label="Next year"><span class="chevron"></span></button>
		</header>

		<section class="calendar-stage" aria-label="Calendar">
			<div class="month-row">
				<button class="side-arrow prev" id="prevMonth" aria-label="Previous month"><span class="triangle"></span></button>
				<div class="month-card">
					<div class="month-title" id="monthTitle"></div>
					<div class="weekday-grid" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
					<div class="dates-grid" id="datesGrid"></div>
				</div>
				<button class="side-arrow" id="nextMonth" aria-label="Next month"><span class="triangle"></span></button>
			</div>

			<section class="event-area" aria-label="Events for selected day">
				<form class="event-form" id="eventForm">
                  <input class="event-input" id="eventInput" type="text" placeholder="Add an event…" aria-label="Event name" maxlength="100" required>
                  <button class="add-button" id="addButton" aria-label="Add event">save</button>
                </form>
				<div class="event-list" id="eventList" aria-live="polite"></div>
			</section>
		</section>

		<footer class="day-bar">
			<button class="nav-arrow prev" id="prevDay" aria-label="Previous day"><span class="chevron"></span></button>
			<div class="day-copy"><strong id="selectedDate"></strong><button class="today-link" id="todayButton">Today</button></div>
			<button class="nav-arrow" id="nextDay" aria-label="Next day"><span class="chevron"></span></button>
		</footer>
	</main>
	<script>
		(() => {
			const selected = new Date();
			selected.setHours(0, 0, 0, 0);
			const today = new Date();
			today.setHours(0, 0, 0, 0);
			const events = JSON.parse(localStorage.getItem('dayview-events') || '{}');
			const $ = id => document.getElementById(id);
			const keyFor = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

			function render() {
				$('yearLabel').textContent = selected.getFullYear();
				$('monthTitle').textContent = selected.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
				$('selectedDate').textContent = selected.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
				const grid = $('datesGrid');
				grid.replaceChildren();
				const first = new Date(selected.getFullYear(), selected.getMonth(), 1);
				const start = new Date(selected.getFullYear(), selected.getMonth(), 1 - first.getDay());
				for (let i = 0; i < 42; i++) {
					const date = new Date(start);
					date.setDate(start.getDate() + i);
					const button = document.createElement('button');
					button.type = 'button';
					button.className = 'date-cell';
					button.textContent = date.getDate();
					button.setAttribute('aria-label', date.toLocaleDateString());
					if (date.getMonth() !== selected.getMonth()) button.classList.add('outside');
					if (keyFor(date) === keyFor(selected)) button.classList.add('selected');
					if (keyFor(date) === keyFor(today)) button.classList.add('today');
					button.addEventListener('click', () => { selected.setTime(date.getTime()); render(); });
					grid.append(button);
				}
				renderEvents();
			}

			function renderEvents() {
				const list = $('eventList');
				list.replaceChildren();
				(events[keyFor(selected)] || []).forEach((text, index) => {
					const row = document.createElement('div');
					row.className = 'event-item';
					const label = document.createElement('span');
					label.textContent = text;
					const remove = document.createElement('button');
					remove.className = 'remove-event';
					remove.type = 'button';
					remove.setAttribute('aria-label', `Remove ${text}`);
					remove.textContent = '×';
					remove.addEventListener('click', () => {
						events[keyFor(selected)].splice(index, 1);
						if (!events[keyFor(selected)].length) delete events[keyFor(selected)];
						localStorage.setItem('dayview-events', JSON.stringify(events));
						renderEvents();
					});
					row.append(label, remove);
					list.append(row);
				});
			}

			function moveDays(amount) { selected.setDate(selected.getDate() + amount); render(); }
			function moveMonths(amount) { selected.setDate(1); selected.setMonth(selected.getMonth() + amount); render(); }
			$('prevYear').addEventListener('click', () => { selected.setFullYear(selected.getFullYear() - 1); render(); });
			$('nextYear').addEventListener('click', () => { selected.setFullYear(selected.getFullYear() + 1); render(); });
			$('prevMonth').addEventListener('click', () => moveMonths(-1));
			$('nextMonth').addEventListener('click', () => moveMonths(1));
			$('prevDay').addEventListener('click', () => moveDays(-1));
			$('nextDay').addEventListener('click', () => moveDays(1));
			$('todayButton').addEventListener('click', () => { selected.setTime(today.getTime()); render(); });
			$('eventForm').addEventListener('submit', event => {
				event.preventDefault();
				const value = $('eventInput').value.trim();
				if (!value) return;
				(events[keyFor(selected)] ||= []).push(value);
				localStorage.setItem('dayview-events', JSON.stringify(events));
				$('eventInput').value = '';
				renderEvents();
			});
			render();
		})();
	</script>
</body>
</html>
