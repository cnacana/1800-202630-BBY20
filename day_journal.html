<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dayview Journal — Backtrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/dayview-journal.css">
</head>
<body class="container-fluid min-vh-100 d-flex justify-content-center p-0">
  <a class="btn btn-light border shadow-sm side-nav-button side-nav-login position-fixed" href="login.html" aria-label="Go to login">
    <span class="side-nav-arrow" aria-hidden="true">‹</span>
    <span class="side-nav-tooltip" aria-hidden="true">Login</span>
  </a>
  <main class="journal-shell d-flex flex-column flex-grow-1 mx-auto" aria-label="Dayview journal page">
    <header class="clock-box" aria-live="polite">
      <span class="section-label"><b>It is...</b></span>
      <time class="clock-time" id="liveClock">--:--:--</time>
      <span class="clock-date" id="liveDate"></span>
    </header>
    <section class="journal-box" aria-label="Today's journal">
      <div class="journal-header">
        <label class="section-label" for="journalTextarea">Today's journal</label>
        <div class="journal-actions">
          <span class="journal-image-help" id="journalImageHelp">1 picture per day, max 2 MB, compressed for Firestore</span>
          <input
            class="visually-hidden journal-image-input"
            id="journalImageInput"
            type="file"
            accept="image/*"
            aria-describedby="journalImageHelp"
            disabled
          >
          <label class="journal-image-button" for="journalImageInput">Add or replace picture</label>
          <span class="save-status" id="journalStatus" role="status" aria-live="polite">Saved</span>
        </div>
      </div>
      <img class="journal-image-preview" id="journalImagePreview" alt="Today's journal picture" hidden>
      <textarea
        id="journalTextarea"
        class="journal-textarea"
        placeholder="Write your reflections, notes, or progress for today…"
        aria-label="Today's journal entry"
      ></textarea>
    </section>
    <section class="todo-box" aria-label="ToDo">
      <span class="section-label">ToDo</span>
      <form class="todo-form" id="todoForm">
        <input
          class="todo-input"
          id="todoInput"
          type="text"
          placeholder="Add a to-do item…"
          aria-label="To-do item"
          maxlength="120"
          required
        >
        <button class="todo-save-btn" id="todoSaveBtn" type="submit" aria-label="Save to-do item">save</button>
      </form>
      <div class="todo-list" id="todoList" aria-live="polite"></div>
    </section>
  </main>
  <a class="btn btn-light border shadow-sm side-nav-button side-nav-calendar position-fixed" href="calendar.html" aria-label="Go to calendar">
    <span class="side-nav-arrow" aria-hidden="true">›</span>
    <span class="side-nav-tooltip" aria-hidden="true">Calendar</span>
  </a>

  <script type="module">
    import { onAuthStateChanged } from 'firebase/auth';
    import { auth } from './src/firebaseConfig.js';
    import {
      MAX_JOURNAL_IMAGE_FILE_SIZE,
      compressJournalImage,
      readJournalImage,
      saveJournalImage,
    } from './src/journalImages.js';

    (() => {
      const $ = id => document.getElementById(id);
      const today = new Date();
      const dayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      const JOURNAL_STORAGE_KEY = 'dayview-journal-entries';
      const TODO_STORAGE_KEY = 'dayview-todo-items';

      const journalEntries = JSON.parse(localStorage.getItem(JOURNAL_STORAGE_KEY) || '{}');
      const todoItems = JSON.parse(localStorage.getItem(TODO_STORAGE_KEY) || '{}');
      function updateClock() {
        const now = new Date();
        $('liveClock').textContent = now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        $('liveDate').textContent = now.toLocaleDateString([], {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });
      }

      const textarea = $('journalTextarea');
      textarea.value = journalEntries[dayKey] || '';

      const imageInput = $('journalImageInput');
      const imagePreview = $('journalImagePreview');
      let currentUser = null;

      function getCurrentUser() {
        return new Promise((resolve, reject) => {
          const unsubscribe = onAuthStateChanged(auth, user => {
            unsubscribe();
            resolve(user);
          }, error => {
            unsubscribe();
            reject(error);
          });
        });
      }

      async function loadJournalImage() {
        imageInput.disabled = true;
        try {
          currentUser = await getCurrentUser();
          if (!currentUser) {
            $('journalStatus').textContent = 'Sign in to save pictures to Firestore.';
            return;
          }

          const image = await readJournalImage(currentUser.uid, dayKey);
          if (image) {
            imagePreview.src = image;
            imagePreview.hidden = false;
            $('journalStatus').textContent = 'Picture loaded from Firestore.';
          } else {
            imagePreview.removeAttribute('src');
            imagePreview.hidden = true;
          }
        } catch (error) {
          console.error('Could not load journal picture:', error);
          $('journalStatus').textContent = error instanceof Error
            ? `Could not load picture: ${error.message}`
            : 'Could not load picture. Please try again.';
        } finally {
          imageInput.disabled = !currentUser;
        }
      }

      imageInput.addEventListener('change', async () => {
        const file = imageInput.files[0];
        if (!file) return;

        if (!currentUser) {
          $('journalStatus').textContent = 'Sign in to save pictures to Firestore.';
          imageInput.value = '';
          return;
        }

        if (!file.type.startsWith('image/')) {
          $('journalStatus').textContent = 'Choose an image file.';
          imageInput.value = '';
          return;
        }

        if (file.size > MAX_JOURNAL_IMAGE_FILE_SIZE) {
          $('journalStatus').textContent = 'Picture must be 2 MB or smaller.';
          imageInput.value = '';
          return;
        }

        imageInput.disabled = true;
        $('journalStatus').textContent = 'Compressing picture...';
        try {
          const image = await compressJournalImage(file);
          $('journalStatus').textContent = 'Saving picture to Firestore...';
          await saveJournalImage(currentUser.uid, dayKey, image);

          imagePreview.src = image;
          imagePreview.hidden = false;
          $('journalStatus').textContent = 'Picture saved to Firestore.';
        } catch (error) {
          console.error('Could not save journal picture:', error);
          $('journalStatus').textContent = error instanceof Error
            ? `Could not save picture: ${error.message}`
            : 'Could not save picture. Please try again.';
        } finally {
          imageInput.value = '';
          imageInput.disabled = false;
        }
      });

      textarea.addEventListener('input', () => {
        journalEntries[dayKey] = textarea.value;
        localStorage.setItem(JOURNAL_STORAGE_KEY, JSON.stringify(journalEntries));
        $('journalStatus').textContent = 'Saved';
      });
      function saveTodos() {
        localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(todoItems));
      }

      function renderTodos() {
        const list = $('todoList');
        list.replaceChildren();
        const items = todoItems[dayKey] || [];

        items.forEach((item, index) => {
          const row = document.createElement('div');
          row.className = 'todo-item';

          const left = document.createElement('label');
          left.className = 'todo-check-label';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'todo-checkbox';
          checkbox.checked = Boolean(item.done);
          checkbox.addEventListener('change', () => {
            todoItems[dayKey][index].done = checkbox.checked;
            saveTodos();
            renderTodos();
          });

          const text = document.createElement('span');
          text.className = 'todo-text' + (item.done ? ' completed' : '');
          text.textContent = item.text;

          left.append(checkbox, text);

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'remove-todo';
          removeBtn.setAttribute('aria-label', `Remove ${item.text}`);
          removeBtn.textContent = '×';
          removeBtn.addEventListener('click', () => {
            todoItems[dayKey].splice(index, 1);
            if (!todoItems[dayKey].length) delete todoItems[dayKey];
            saveTodos();
            renderTodos();
          });

          row.append(left, removeBtn);
          list.append(row);
        });
      }

      $('todoForm').addEventListener('submit', event => {
        event.preventDefault();
        const value = $('todoInput').value.trim();
        if (!value) return;
        (todoItems[dayKey] ||= []).push({ text: value, done: false });
        saveTodos();
        $('todoInput').value = '';
        renderTodos();
      });

      updateClock();
      setInterval(updateClock, 1000);
      renderTodos();
      loadJournalImage();
    })();
  </script>
</body>
</html>
