<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dayview Journal — Backtrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/dayview-journal.css">
</head>
<body>
  <main class="journal-shell" aria-label="Dayview journal page">
    <header class="clock-box" aria-live="polite">
      <span class="section-label">Clock (current time)</span>
      <time class="clock-time" id="liveClock">--:--:--</time>
      <span class="clock-date" id="liveDate"></span>
    </header>
    <section class="journal-box" aria-label="Today's journal">
      <div class="journal-header">
        <label class="section-label" for="journalTextarea">Today's journal</label>
        <span class="save-status" id="journalStatus">Saved</span>
      </div>
      <textarea
        id="journalTextarea"
        class="journal-textarea"
        placeholder="Write your reflections, notes, or progress for today…"
        aria-label="Today's journal entry"
      ></textarea>
    </section>
    <section class="todo-box" aria-label="ToDo">
      <span class="section-label">ToDo</span>
      <form class="todo-form" id="todoForm">
        <input
          class="todo-input"
          id="todoInput"
          type="text"
          placeholder="Add a to-do item…"
          aria-label="To-do item"
          maxlength="120"
          required
        >
        <button class="todo-save-btn" id="todoSaveBtn" type="submit" aria-label="Save to-do item">save</button>
      </form>
      <div class="todo-list" id="todoList" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const today = new Date();
      const dayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      const JOURNAL_STORAGE_KEY = 'dayview-journal-entries';
      const TODO_STORAGE_KEY = 'dayview-todo-items';

      const journalEntries = JSON.parse(localStorage.getItem(JOURNAL_STORAGE_KEY) || '{}');
      const todoItems = JSON.parse(localStorage.getItem(TODO_STORAGE_KEY) || '{}');
      function updateClock() {
        const now = new Date();
        $('liveClock').textContent = now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        $('liveDate').textContent = now.toLocaleDateString([], {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });
      }

      const textarea = $('journalTextarea');
      textarea.value = journalEntries[dayKey] || '';

      textarea.addEventListener('input', () => {
        journalEntries[dayKey] = textarea.value;
        localStorage.setItem(JOURNAL_STORAGE_KEY, JSON.stringify(journalEntries));
        $('journalStatus').textContent = 'Saved';
      });
      function saveTodos() {
        localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(todoItems));
      }

      function renderTodos() {
        const list = $('todoList');
        list.replaceChildren();
        const items = todoItems[dayKey] || [];

        items.forEach((item, index) => {
          const row = document.createElement('div');
          row.className = 'todo-item';

          const left = document.createElement('label');
          left.className = 'todo-check-label';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'todo-checkbox';
          checkbox.checked = Boolean(item.done);
          checkbox.addEventListener('change', () => {
            todoItems[dayKey][index].done = checkbox.checked;
            saveTodos();
            renderTodos();
          });

          const text = document.createElement('span');
          text.className = 'todo-text' + (item.done ? ' completed' : '');
          text.textContent = item.text;

          left.append(checkbox, text);

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'remove-todo';
          removeBtn.setAttribute('aria-label', `Remove ${item.text}`);
          removeBtn.textContent = '×';
          removeBtn.addEventListener('click', () => {
            todoItems[dayKey].splice(index, 1);
            if (!todoItems[dayKey].length) delete todoItems[dayKey];
            saveTodos();
            renderTodos();
          });

          row.append(left, removeBtn);
          list.append(row);
        });
      }

      $('todoForm').addEventListener('submit', event => {
        event.preventDefault();
        const value = $('todoInput').value.trim();
        if (!value) return;
        (todoItems[dayKey] ||= []).push({ text: value, done: false });
        saveTodos();
        $('todoInput').value = '';
        renderTodos();
      });

      updateClock();
      setInterval(updateClock, 1000);
      renderTodos();
    })();
  </script>
</body>
</html>
